name: CertMind checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import sys; sys.path.insert(0, '.'); from tests.test_core import test_evaluation_passes_valid_response, test_evaluation_detects_forbidden_phrase, test_question_import_deduplicates_and_flags_unanswered; test_evaluation_passes_valid_response(); test_evaluation_detects_forbidden_phrase(); test_question_import_deduplicates_and_flags_unanswered(); print('core tests passed')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
